<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offers & Deals - Food DNA</title>
    <meta name="description" content="Exclusive dining offers and discount promotions on Food DNA.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="fd-app-body">
    <div class="fd-app-layout">
        <!-- Dual-zone sidebar -->
        <div id="sidebar"></div>

        <div class="fd-content-wrapper">
            <!-- Topbar -->
            <div id="topbar"></div>

            <main class="fd-main-content" id="mainContent">
                <!-- Page Header -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                    <div>
                        <h1 class="fd-page-title mb-1">Exclusive Offers & Promotions</h1>
                        <p class="text-secondary mb-0">Discover limited-time dining discounts validated securely at checkout.</p>
                    </div>
                </div>

                <div id="pageMessage"></div>

                <!-- Offers Grid -->
                <div id="offerList" class="row g-4 mb-4">
                    <div class="col-12 p-4 text-center text-secondary small">Loading available offers...</div>
                </div>

                <!-- Restaurant Admin Offer Creation Section -->
                <div id="adminOfferForm" hidden class="fd-card p-4 mt-4">
                    <h2 class="h5 fw-bold mb-2">Create Restaurant Offer</h2>
                    <p class="text-secondary small mb-4">Publish a discount campaign for dishes ordered through your restaurant.</p>

                    <form id="offerForm" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold" for="offerTitle">Campaign Title *</label>
                            <input id="offerTitle" class="form-control" maxlength="150" placeholder="e.g. Weekend Feast 20% Off" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold" for="offerDiscount">Discount Percentage (%) *</label>
                            <input id="offerDiscount" type="number" min="0.01" max="100" step="0.01" class="form-control" placeholder="20" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold" for="offerDescription">Campaign Details</label>
                            <textarea id="offerDescription" class="form-control" rows="2" placeholder="Applicable on all main courses and combo platters..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold" for="offerStart">Start Date *</label>
                            <input id="offerStart" type="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold" for="offerEnd">End Date *</label>
                            <input id="offerEnd" type="date" class="form-control" required>
                        </div>
                        <div class="col-12 mt-4">
                            <button class="btn btn-fd px-4" type="submit">Publish Offer</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/engagement.js"></script>
</body>
</html>
