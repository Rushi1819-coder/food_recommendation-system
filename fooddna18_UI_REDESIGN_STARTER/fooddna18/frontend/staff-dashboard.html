<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Staff Dashboard - Food DNA</title>
    <meta name="description" content="Live kitchen queue and order preparation workflow on Food DNA.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="fd-app-body">
    <div class="fd-app-layout">
        <!-- Dual-zone sidebar -->
        <div id="sidebar"></div>

        <div class="fd-content-wrapper">
            <!-- Topbar -->
            <div id="topbar"></div>

            <main class="fd-main-content" id="mainContent">
                <!-- Page Header -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h1 class="fd-page-title mb-0">Kitchen Orders Queue</h1>
                            <span class="fd-badge fd-badge-warning" id="activeKitchenCount">0 Active</span>
                        </div>
                        <p class="text-secondary mb-0">Restaurant Kitchen Station: <strong id="restaurantName" class="text-dark">Connecting...</strong></p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-fd-outline btn-sm" id="refreshQueueBtn">↻ Refresh Queue</button>
                    </div>
                </div>

                <div id="pageMessage"></div>

                <!-- Kitchen Filter Pills -->
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <button type="button" class="fd-pill active" data-staff-filter="all">All Orders</button>
                    <button type="button" class="fd-pill" data-staff-filter="pending">New Pending</button>
                    <button type="button" class="fd-pill" data-staff-filter="prep">In Preparation</button>
                    <button type="button" class="fd-pill" data-staff-filter="ready">Ready for Pickup</button>
                </div>

                <!-- Live Orders Cards Container -->
                <div id="kitchenQueue">
                    <div class="p-4 text-center text-secondary small">Connecting to kitchen order queue...</div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/staff-dashboard.js"></script>
</body>
</html>
