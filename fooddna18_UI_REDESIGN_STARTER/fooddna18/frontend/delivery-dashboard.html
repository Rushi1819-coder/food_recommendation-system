<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delivery Partner Portal - Food DNA</title>
    <meta name="description" content="Claim deliveries, track routes, and record Cash on Delivery collections on Food DNA.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="fd-app-body">
    <div class="fd-app-layout">
        <!-- Dual-zone sidebar -->
        <div id="sidebar"></div>

        <div class="fd-content-wrapper">
            <!-- Topbar -->
            <div id="topbar"></div>

            <main class="fd-main-content" id="mainContent">
                <!-- Page Header -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h1 class="fd-page-title mb-0">Delivery Dashboard</h1>
                            <span class="fd-badge fd-badge-success" id="riderStatusBadge">Available</span>
                        </div>
                        <p class="text-secondary mb-0">Claim ready kitchen orders and execute Cash on Delivery fulfillments.</p>
                    </div>
                    <div>
                        <span class="fd-badge fd-badge-info fs-6 px-3 py-2" id="availableCountBadge">0 Available</span>
                    </div>
                </div>

                <div id="pageMessage"></div>

                <!-- Navigation Tabs -->
                <div class="d-flex gap-2 mb-4">
                    <button type="button" class="fd-pill active" data-delivery-tab="active">My Active Deliveries</button>
                    <button type="button" class="fd-pill" data-delivery-tab="available">Available for Claim</button>
                </div>

                <!-- Tab 1: Active Deliveries -->
                <div id="tabContentActive">
                    <div id="activeDeliveriesList">
                        <div class="p-4 text-center text-secondary small">Loading active deliveries...</div>
                    </div>
                </div>

                <!-- Tab 2: Available Orders -->
                <div id="tabContentAvailable" hidden>
                    <div id="availableOrdersList">
                        <div class="p-4 text-center text-secondary small">Loading available orders...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/delivery-dashboard.js"></script>
</body>
</html>
