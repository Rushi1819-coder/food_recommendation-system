<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - Food DNA</title>
    <meta name="description" content="Personalized meal recommendations tailored to your unique Food DNA taste profile.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="fd-app-body">
    <div class="fd-app-layout">
        <!-- Dual-zone sidebar -->
        <div id="sidebar"></div>

        <div class="fd-content-wrapper">
            <!-- Topbar -->
            <div id="topbar"></div>

            <main class="fd-main-content" id="mainContent">
                <div id="recPageMessage" aria-live="polite"></div>

                <div id="recContent" hidden>
                    <!-- Header Section -->
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <h1 class="fd-page-title mb-0">Recommended for You</h1>
                                <span class="fd-badge fd-badge-primary">DNA Matched</span>
                            </div>
                            <div class="text-secondary small" id="recSummary" aria-live="polite"></div>
                        </div>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <div class="d-flex align-items-center gap-1">
                                <label class="small text-secondary fw-semibold mb-0" for="recLimit">Show:</label>
                                <select id="recLimit" class="form-select form-select-sm" style="width: auto;">
                                    <option value="5">5</option>
                                    <option value="10" selected>10</option>
                                    <option value="20">20</option>
                                </select>
                            </div>
                            <button type="button" id="recRefresh" class="btn btn-fd btn-sm">↻ Refresh</button>
                            <a class="btn btn-fd-outline btn-sm" href="preferences.html">Tune Food DNA</a>
                        </div>
                    </div>

                    <!-- User Active DNA Badges -->
                    <div class="fd-card p-3 mb-4" style="background: linear-gradient(135deg, #FFF, #FCEEF2);">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="fs-5">🧬</span>
                            <span class="fw-bold small text-uppercase" style="color: var(--fd-primary);">Your Active Food DNA Factors</span>
                        </div>
                        <div id="recPrefs" class="d-flex flex-wrap gap-2"></div>
                        <div id="recNotes" class="small text-secondary mt-2 mb-0"></div>
                    </div>

                    <!-- Recommended Dishes Grid -->
                    <div class="mb-5">
                        <div id="recResults" aria-live="polite"></div>
                    </div>

                    <!-- History Section -->
                    <section class="fd-card p-4" aria-labelledby="historyHeading">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 fw-bold mb-0" id="historyHeading">Recommendation History</h2>
                            <span class="small text-secondary">Past algorithm suggestions</span>
                        </div>
                        <div id="historyResults"></div>
                        <div id="historyPager" class="mt-3"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/browse.js"></script>
    <script src="js/recommendations.js"></script>
    <script>initRecommendationsPage();</script>
</body>
</html>
